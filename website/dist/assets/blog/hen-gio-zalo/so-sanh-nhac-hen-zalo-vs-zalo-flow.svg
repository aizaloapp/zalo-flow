<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0084ff"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="480" rx="16" fill="#0b1329"/>
  <rect x="2" y="2" width="996" height="476" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff">
    So Sánh 3 Phương Pháp Hẹn Giờ Gửi Tin Nhắn Trên Zalo
  </text>
  <text x="50" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">
    Bóc trần sự thật về tính năng "Nhắc hẹn" của Zalo và bài toán chi phí Zalo OA
  </text>

  <!-- 3 Columns -->
  <!-- Col 1: Nhắc hẹn mặc định -->
  <g transform="translate(50, 115)">
    <rect width="280" height="320" rx="12" fill="url(#cardBg)" stroke="#475569" stroke-width="1"/>
    <rect width="280" height="45" rx="12" fill="#334155"/>
    <rect y="35" width="280" height="10" fill="#334155"/>
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#cbd5e1">1. Tính Năng "Nhắc Hẹn" Zalo</text>
    
    <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ef4444" font-weight="700">❌ KHÔNG TỰ GỬI TIN</text>
    <text x="20" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">• Chỉ báo chuông cho người tạo</text>
    <text x="20" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">• Khách hàng KHÔNG nhận được gì</text>
    <text x="20" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">• Vẫn phải gõ tay gửi tin nhắn</text>
    <text x="20" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">• Không hỗ trợ gửi ảnh / hợp đồng</text>
    
    <rect x="20" y="265" width="240" height="35" rx="8" fill="rgba(239, 68, 68, 0.15)"/>
    <text x="35" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fca5a5">Không giải quyết tự động hóa</text>
  </g>

  <!-- Col 2: Zalo OA Doanh Nghiệp -->
  <g transform="translate(360, 115)">
    <rect width="280" height="320" rx="12" fill="url(#cardBg)" stroke="#475569" stroke-width="1"/>
    <rect width="280" height="45" rx="12" fill="#334155"/>
    <rect y="35" width="280" height="10" fill="#334155"/>
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#cbd5e1">2. Zalo OA Doanh Nghiệp</text>
    
    <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#f59e0b" font-weight="700">⚠️ CHI PHÍ RẤT ĐẮT ĐỎ</text>
    <text x="20" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">• Bắt buộc có giấy phép ĐKKD</text>
    <text x="20" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">• Gói duy trì từ 660.000đ/tháng</text>
    <text x="20" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">• Phí ZNS tính trên từng tin nhắn</text>
    <text x="20" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">• Không dùng cho nick cá nhân</text>
    
    <rect x="20" y="265" width="240" height="35" rx="8" fill="rgba(245, 158, 11, 0.15)"/>
    <text x="35" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fcd34d">Chỉ hợp doanh nghiệp lớn</text>
  </g>

  <!-- Col 3: Zalo-Flow v1.1.0 -->
  <g transform="translate(670, 115)">
    <rect width="280" height="320" rx="12" fill="url(#cardBg)" stroke="#00d2ff" stroke-width="2"/>
    <rect width="280" height="45" rx="12" fill="url(#brandGrad)"/>
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff">⭐ 3. Zalo-Flow v1.1.0</text>
    
    <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#10b981" font-weight="700">✅ TỰ ĐỘNG GỬI 1-1 MIỄN PHÍ</text>
    <text x="20" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e2e8f0">• Dùng trực tiếp cho Zalo cá nhân</text>
    <text x="20" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e2e8f0">• Đính kèm ảnh &amp; tài liệu hợp đồng</text>
    <text x="20" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e2e8f0">• Lá chắn Auto-Pause chống vô duyên</text>
    <text x="20" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e2e8f0">• Mã nguồn mở, bảo mật tuyệt đối</text>
    
    <rect x="20" y="265" width="240" height="35" rx="8" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="35" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">Giải pháp số 1 cho Sales / Shop</text>
  </g>
</svg>
