    <text x="20" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">📎 Đính kèm: Bang_Gia_2PN.pdf, Anh_Can_Ho.jpg</text>
    <rect x="490" y="88" width="155" height="36" rx="8" fill="#10b981"/>
    <text x="510" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#fff" font-weight="700">🚀 LÊN LỊCH NGAY</text>
