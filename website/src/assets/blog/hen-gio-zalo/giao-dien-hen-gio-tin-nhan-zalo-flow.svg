      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bgG)"/>
  <rect x="2" y="2" width="996" height="496" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>

