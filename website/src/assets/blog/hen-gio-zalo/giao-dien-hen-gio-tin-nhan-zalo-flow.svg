  <text x="58" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#fff" font-weight="700">H</text>
  <text x="95" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#fff" font-weight="700">Hoàng BĐS</text>
