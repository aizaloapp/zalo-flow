        <text x="25" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">"Bạn là Mai Anh, chuyên viên tư vấn thời trang nữ thân thiện, xưng hô Em - Chị,</text>
        <text x="25" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">luôn khéo léo xin số đo chiều cao/cân nặng để gợi ý size chuẩn nhất..."</text>

        <!-- Field 2: Memory / Wiki -->
        <text x="15" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">📚 Kho Tri Thức Sản Phẩm (Mini Second Brain Wiki):</text>
        <rect x="15" y="115" width="465" height="48" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="25" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">[Đã liên kết Wiki: catalogue_mua_thu_2026.md - 36 SKU sản phẩm, bảng size,</text>
        <text x="25" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">chính sách đổi trả 7 ngày, miễn phí vận chuyển từ 499k]</text>

        <!-- Field 3: Scope & Rules -->
        <text x="15" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f87171">🛡️ Phạm Vi &amp; Điều Cấm Kỵ (Guardrails):</text>
        <rect x="15" y="195" width="465" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="25" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Tuyệt đối không cam kết thời gian giao hàng nếu khách cần gấp trong 2 giờ</text>
        <text x="25" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Chuyển cuộc gọi cho quản lý nếu khách phàn nàn chất lượng vải</text>

        <!-- Field 4: Model Override -->
        <text x="15" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c084fc">⚙️ Model Ghi Đè (Tùy chọn):</text>
        <rect x="15" y="270" width="465" height="34" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="25" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff">Google: gemini-2.5-flash (Phản hồi siêu tốc &lt; 0.8s, giá rẻ)</text>

        <!-- Save button -->
        <rect x="340" y="318" width="140" height="34" rx="6" fill="#10b981"/>
        <text x="410" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">💾 Lưu Hồ Sơ AI</text>
