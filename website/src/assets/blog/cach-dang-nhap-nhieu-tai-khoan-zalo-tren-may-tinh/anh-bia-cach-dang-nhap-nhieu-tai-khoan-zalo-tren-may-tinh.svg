        <text x="27" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff">M1</text>
        <text x="65" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Minh Bán Lẻ (Shop A)</text>
        <text x="65" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#10b981">● Đang hoạt động</text>
        <line x1="15" y1="65" x2="285" y2="65" stroke="#334155" stroke-width="1"/>
        <text x="15" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Hồ sơ AI:</text>
        <rect x="75" y="73" width="210" height="22" rx="4" fill="rgba(0, 210, 255, 0.15)"/>
        <text x="85" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#00d2ff">🛒 Bán Hàng &amp; Chốt Deal E-com</text>
        <text x="15" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Model: Gemini 2.5 Flash</text>
        <text x="15" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Wiki: 36 sản phẩm thời trang</text>
      </g>

      <g transform="translate(350, 60)">
