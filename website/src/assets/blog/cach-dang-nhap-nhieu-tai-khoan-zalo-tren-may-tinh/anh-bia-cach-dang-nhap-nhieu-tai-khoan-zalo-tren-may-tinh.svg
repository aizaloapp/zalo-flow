<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0084ff"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Glow orbs -->
  <circle cx="200" cy="150" r="180" fill="#0084ff" opacity="0.16" filter="url(#glow)"/>
  <circle cx="1000" cy="420" r="220" fill="#8b5cf6" opacity="0.14" filter="url(#glow)"/>

  <!-- Grid overlay -->
  <path d="M 0,105 H 1200 M 0,210 H 1200 M 0,315 H 1200 M 0,420 H 1200 M 0,525 H 1200" stroke="#1e293b" stroke-width="1" opacity="0.35"/>
  <path d="M 200,0 V 630 M 400,0 V 630 M 600,0 V 630 M 800,0 V 630 M 1000,0 V 630" stroke="#1e293b" stroke-width="1" opacity="0.35"/>

  <!-- Main Content -->
  <g transform="translate(100, 65)">
    <!-- Badge -->
    <rect x="0" y="0" width="375" height="38" rx="19" fill="rgba(0, 132, 255, 0.15)" stroke="#00d2ff" stroke-width="1.5"/>
    <text x="22" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#00d2ff">🚀 ZALO-FLOW V1.4.0 • MULTI-ACCOUNT &amp; AI PROFILE</text>

    <!-- Main Titles -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#ffffff">
      Đăng Nhập Nhiều Tài Khoản Zalo Trên PC
    </text>
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="url(#primaryGrad)">
      Tích Hợp Hồ Sơ Bot AI Độc Lập Cho Từng Nick
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#94a3b8">
      Quản lý đa tài khoản tập trung • Tách biệt Persona &amp; Wiki • Không ngốn RAM • Chống khóa nick
    </text>

    <!-- UI Mockup Window -->
    <g transform="translate(0, 260)">
      <rect width="1000" height="240" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="2"/>
      
      <!-- Window Titlebar -->
      <rect width="1000" height="42" rx="16" fill="#0f172a"/>
      <rect y="26" width="1000" height="16" fill="#0f172a"/>
      <circle cx="25" cy="21" r="6" fill="#ef4444"/>
      <circle cx="45" cy="21" r="6" fill="#f59e0b"/>
      <circle cx="65" cy="21" r="6" fill="#10b981"/>
      <text x="100" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="600">Zalo-Flow AI Hub — Multi-Account Management Console</text>

      <!-- Account Cards Row -->
