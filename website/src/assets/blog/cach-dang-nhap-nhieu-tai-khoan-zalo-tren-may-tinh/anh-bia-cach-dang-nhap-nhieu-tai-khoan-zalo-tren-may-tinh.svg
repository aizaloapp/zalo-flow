        <rect width="300" height="155" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
        <circle cx="35" cy="38" r="18" fill="#7c3aed"/>
        <text x="27" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff">M2</text>
        <text x="65" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Khoa Tư Vấn B2B</text>
        <text x="65" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#10b981">● Đang hoạt động</text>
        <line x1="15" y1="65" x2="285" y2="65" stroke="#334155" stroke-width="1"/>
        <text x="15" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Hồ sơ AI:</text>
        <rect x="75" y="73" width="210" height="22" rx="4" fill="rgba(139, 92, 246, 0.18)"/>
        <text x="85" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c084fc">💼 Tư Vấn Giải Pháp B2B</text>
        <text x="15" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Model: Claude 3.5 Sonnet</text>
        <text x="15" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Wiki: Hồ sơ năng lực &amp; Báo giá</text>
      </g>

      <g transform="translate(675, 60)">
        <!-- Account Card 3 -->
        <rect width="300" height="155" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="38" r="18" fill="#059669"/>
        <text x="27" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff">M3</text>
        <text x="65" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Hỗ Trợ Kỹ Thuật VIP</text>
        <text x="65" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#10b981">● Đang hoạt động</text>
        <line x1="15" y1="65" x2="285" y2="65" stroke="#334155" stroke-width="1"/>
        <text x="15" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Hồ sơ AI:</text>
        <rect x="75" y="73" width="210" height="22" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="85" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399">🛠️ CSKH &amp; Xử Lý Sự Cố</text>
        <text x="15" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Model: DeepSeek V3</text>
        <text x="15" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Wiki: Sổ tay quy trình SOP</text>
      </g>
    </g>
  </g>
</svg>
