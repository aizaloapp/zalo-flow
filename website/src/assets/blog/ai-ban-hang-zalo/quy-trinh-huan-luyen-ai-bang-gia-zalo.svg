    <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Nạp Tri Thức 1-Click:</text>
    <text x="18" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">• Dán thẳng vào tab Cài đặt AI</text>
    <text x="18" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">• Hoặc nạp qua URL Markdown</text>
    <text x="18" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">• Lưu trữ an toàn SQLite máy tính</text>
    <text x="18" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">• Cập nhật giá đổi tức thì</text>

    <!-- Action Graphic -->
    <rect x="15" y="215" width="175" height="115" rx="8" fill="#0f172a" stroke="#00d2ff"/>
    <text x="25" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8" font-weight="700">⚙️ ZALO-FLOW ENGINE</text>
    <text x="25" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Bấm "Lưu Cài Đặt"</text>
    <rect x="25" y="288" width="140" height="28" rx="6" fill="#0084ff"/>
    <text x="45" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff" font-weight="700">💾 Đã Kích Hoạt</text>
  </g>

  <!-- Step 4 Card (Hero result) -->
  <g transform="translate(755, 105)">
    <rect width="200" height="345" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <circle cx="35" cy="35" r="18" fill="#10b981"/>
    <text x="29" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">4</text>
    <text x="65" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#34d399">Tự Động Bán</text>

    <!-- Details -->
    <text x="16" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Vận Hành 24/7:</text>
    <text x="16" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">• Trả lời khách trong 3 giây</text>
    <text x="16" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">• Báo giá chuẩn từng đồng</text>
    <text x="16" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">• Mời mua kèm giảm giá</text>
    <text x="16" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">• Thu thập SĐT &amp; Gắn Tag</text>

    <!-- Success Badge -->
    <rect x="15" y="200" width="170" height="130" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981"/>
    <text x="25" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#34d399" font-weight="700">🎯 KẾT QUẢ ĐẠT ĐƯỢC:</text>
    <text x="25" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">Không bỏ lỡ khách đêm</text>
    <text x="25" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">Tiết kiệm 3-5h chat/ngày</text>
    <text x="25" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#fbbf24" font-weight="700">Đơn về ngay cả khi ngủ!</text>
  </g>
</svg>
