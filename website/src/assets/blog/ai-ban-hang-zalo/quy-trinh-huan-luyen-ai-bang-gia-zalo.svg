    <circle cx="35" cy="35" r="18" fill="#0084ff"/>
    <text x="29" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">2</text>
    <text x="65" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">Khóa Kịch Bản</text>

    <!-- Details -->
    <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Thiết lập System Prompt:</text>
    <text x="18" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">• Đặt tên: "Bé Flow / Tên Shop"</text>
    <text x="18" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">• Xưng hô thân mật: Em/Anh</text>
    <text x="18" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">• Chỉ báo giá trong danh mục</text>
    <text x="18" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">• Luôn xin SĐT nhận hàng</text>

    <!-- Key Lock -->
    <rect x="15" y="215" width="175" height="115" rx="8" fill="#064e3b" stroke="#10b981"/>
    <text x="25" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#a7f3d0" font-weight="700">🔒 KHÓA BẢN LỀ:</text>
    <text x="25" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff">Chỉnh Temperature</text>
    <text x="25" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#34d399" font-weight="800">= 0.2 (Chống bịa giá)</text>
  </g>

  <!-- Step 3 Card -->
  <g transform="translate(520, 105)">
    <rect width="205" height="345" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="18" fill="#0084ff"/>
    <text x="29" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">3</text>
    <text x="65" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">Nạp Vào Bot</text>

