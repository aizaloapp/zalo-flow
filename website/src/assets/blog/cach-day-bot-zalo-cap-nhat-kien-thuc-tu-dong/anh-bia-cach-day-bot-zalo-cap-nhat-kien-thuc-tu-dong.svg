<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0084ff"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative Grid lines -->
  <g opacity="0.1" stroke="#334155" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Left Content: Typography & Value Props -->
  <g transform="translate(80, 100)">
    <!-- Badge -->
    <rect width="260" height="38" rx="19" fill="#0084ff" fill-opacity="0.15" stroke="#00d2ff" stroke-width="1.5"/>
    <text x="130" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#00d2ff" text-anchor="middle">✨ TÍNH NĂNG MỚI 2026</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff">
      <tspan x="0" dy="0">Cách Dạy Bot Zalo</tspan>
      <tspan x="0" dy="58" fill="url(#cyanGrad)">Cập Nhật Kiến Thức</tspan>
      <tspan x="0" dy="58">Tự Động Bằng Ảnh &amp; Tệp</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">
      <tspan x="0" dy="0">Không cần viết prompt phức tạp • Dán ảnh Ctrl+V hoặc kéo thả tài liệu</tspan>
      <tspan x="0" dy="28">Bot tự động trích xuất tri thức vào bộ nhớ và áp dụng trả lời khách tức thì!</tspan>
    </text>

    <!-- Bullets -->
    <g transform="translate(0, 315)">
      <circle cx="10" cy="10" r="6" fill="#10b981"/>
      <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Hỗ trợ PDF, Word, Ảnh bảng giá, Ảnh đoạn chat</text>

      <circle cx="10" cy="45" r="6" fill="#00d2ff"/>
      <text x="26" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Xem trước đề xuất (Human-in-the-loop) hoặc Tự động lưu</text>

      <circle cx="10" cy="80" r="6" fill="#f59e0b"/>
      <text x="26" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Hoàn toàn miễn phí, lưu trữ cục bộ Local-first trên PC</text>
    </g>
  </g>

  <!-- Right Content: Interactive UI Mockup -->
  <g transform="translate(680, 85)">
    <!-- Window Frame -->
    <rect width="440" height="460" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>
    
    <!-- Topbar -->
    <rect width="440" height="42" rx="16" fill="#0f172a"/>
    <rect y="26" width="440" height="16" fill="#0f172a"/>
    <circle cx="22" cy="21" r="5" fill="#ef4444"/>
    <circle cx="38" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="54" cy="21" r="5" fill="#10b981"/>
    <text x="220" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">Zalo-Flow — Khay Dạy Bot</text>

    <!-- Tray Container -->
    <g transform="translate(20, 58)">
      <!-- Tray Header -->
      <rect width="400" height="40" rx="8" fill="#0f172a" stroke="rgba(0, 210, 255, 0.3)" stroke-width="1"/>
      <text x="16" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#00d2ff">✨ DẠY BOT</text>
      <text x="96" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">(Dán ảnh Ctrl+V hoặc kéo thả tệp)</text>

      <!-- Dropzone -->
      <rect y="50" width="400" height="110" rx="10" fill="#090d16" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="200" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" text-anchor="middle">📁</text>
      <text x="200" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Kéo thả tài liệu / bảng giá vào đây</text>
      <text x="200" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">hoặc nhấn Ctrl+V để dán ảnh chụp màn hình</text>

      <!-- Prompt Input -->
      <rect y="170" width="400" height="55" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">✍️ Nhập lời dặn hoặc yêu cầu (VD: học giá mới, đổi cách xưng hô)...</text>

      <!-- Action Button -->
      <rect y="235" width="400" height="42" rx="8" fill="url(#cyanGrad)"/>
      <text x="200" y="261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">✨ Dạy Bot Ngay (Phân Tích Bằng AI)</text>

      <!-- Result Card Preview -->
      <g transform="translate(0, 290)">
        <rect width="400" height="90" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
        <circle cx="20" cy="22" r="6" fill="#10b981"/>
        <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10b981">Đã phân tích 1 tệp • Đề xuất cập nhật:</text>
        <rect x="15" y="40" width="370" height="40" rx="6" fill="#1e293b"/>
        <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">📝 Thêm bảng giá combo mới vào Wiki: bang-gia-2026</text>
        <text x="25" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Tự động áp dụng thành công • Bot đã sẵn sàng tư vấn!</text>
      </g>
    </g>
  </g>
</svg>
