name: Anti-Leak & Secret Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Scan for Forbidden IP / Private Infrastructure Patterns
      run: |
        echo "🔍 Scanning for accidental leaks of private infrastructure..."
        if grep -rnE "160\.187\.|43\.134\.|5\.231\.|dragonfarm2509|cloudflare.*workers|bitwarden|D1_DATABASE|R2_BUCKET|aizaloapp@users" \
          --exclude-dir=.git \
          --exclude-dir=node_modules \
          --exclude-dir=sessions \
          --exclude-dir=.github \
          --exclude-dir=.husky \
          --exclude="*.enc" \
          --exclude="*.session" \
          --exclude="package-lock.json" \
          --exclude="AGENTS.md" .; then
          echo "❌ CRITICAL: Found private infrastructure references! Failing build."
          exit 1
        else
          echo "✅ Clean: No private infrastructure leaks found."
        fi

    - name: Gitleaks Scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
